name: paystrater_flutter
description: Paystrater checkout for Flutter. Pay with Paystrater and Transfer to Pay on a publishable key, with no dependencies beyond Flutter.
version: 0.1.0-dev.1
homepage: https://docs.paystrater.com/docs/sdks/flutter
repository: https://github.com/Paystrater/sdk-flutter
issue_tracker: https://github.com/Paystrater/sdk-flutter/issues
topics:
  - payments
  - checkout
  - stablecoin
  - crypto
  - paystrater

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# The Flutter SDK only: HTTP is dart:io's HttpClient, the
# clipboard is flutter/services, and opening links or the share sheet goes
# through this package's own method channel instead of url_launcher.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.paystrater.flutter
        pluginClass: PaystraterFlutterPlugin
      ios:
        pluginClass: PaystraterFlutterPlugin
