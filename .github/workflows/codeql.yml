# Scans the plugin's Kotlin and Swift. CodeQL has no Dart support, and its default
# setup cannot build a Flutter plugin, so this builds the example app's native
# projects, which compile the plugin's native code. Turn CodeQL's default setup
# off in the repo's settings: GitHub rejects this workflow's results while it is on.
#
# The native code is small (one Swift file, one Kotlin file), so pushes and pull
# requests scan only when something native or this workflow changes; the weekly
# run scans everything regardless. The gate is on the steps, not the job: each
# "Analyze (…)" check still runs and passes in a minute, so required checks keep
# their names (a matrix job skipped as a whole reports under an unexpanded name).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - "ios/**"
              - "android/**"
              - "example/**"
              - "pubspec.yaml"
              - ".github/workflows/codeql.yml"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    env:
      SCAN: ${{ needs.changes.outputs.native == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            os: ubuntu-latest
            build: flutter build apk --debug
          - language: swift
            os: macos-latest
            # Only the plugin's pod, not the whole Runner app: it compiles
            # PaystraterFlutterPlugin.swift (and the Flutter pod it needs) in a
            # fraction of the time. xcodebuild itself, since CodeQL does not see
            # the Swift compiler when flutter runs it. The log is kept so the next
            # step can check the plugin's Swift was really compiled.
            build: >-
              set -o pipefail &&
              xcodebuild build -workspace ios/Runner.xcworkspace -scheme paystrater_flutter -configuration Debug
              -destination generic/platform=iOS ARCH=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
              | tee "$RUNNER_TEMP/xcodebuild.log"
    steps:
      - if: env.SCAN == 'true'
        uses: actions/checkout@v6
      - if: env.SCAN == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: env.SCAN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'example/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      # The plugin is built through CocoaPods (its pod scheme is what the Swift build uses)
      - if: env.SCAN == 'true' && matrix.language == 'swift'
        run: flutter config --no-enable-swift-package-manager
      # The example's platform folders are generated here and never committed
      - if: env.SCAN == 'true'
        run: flutter create --platforms=android,ios .
        working-directory: example
      - if: env.SCAN == 'true' && matrix.language == 'swift'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('example/pubspec.yaml', 'ios/paystrater_flutter.podspec') }}
          restore-keys: pods-${{ runner.os }}-
      # Writes Flutter's Xcode settings and installs the pods, which CodeQL needs done first
      - if: env.SCAN == 'true' && matrix.language == 'swift'
        run: flutter build ios --config-only --debug --no-codesign
        working-directory: example
      - if: env.SCAN == 'true' && matrix.language == 'swift'
        run: xcodebuild -list -workspace ios/Runner.xcworkspace
        working-directory: example
      - if: env.SCAN == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      # CodeQL only sees compilers it starts itself, so no Gradle or Kotlin daemons
      - if: env.SCAN == 'true'
        run: ${{ matrix.build }}
        working-directory: example
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
      # Fails if the pod scheme built without the plugin's Swift, so the scan never passes on nothing
      - if: env.SCAN == 'true' && matrix.language == 'swift'
        run: grep -q "PaystraterFlutterPlugin.swift" "$RUNNER_TEMP/xcodebuild.log"
      - if: env.SCAN == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
